<!DOCTYPE html>
<!--
  PÁGINA DE ENTRADA: esta é somente uma interface, sem autenticação ou cadastro.
  Aparência: login.css. Interações: bloco <script> no fim deste arquivo.
  O jogo permanece em jogo.html, que pode ser aberto diretamente.
  Textos podem ser editados aqui; mantenha os IDs usados pelo JavaScript.
-->
<html lang="pt-BR">

<head>
  <!-- UTF-8 permite acentos e naipes; viewport adapta a largura aos celulares. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Royal Hold'em</title>
  <!-- Altere o título acima para mudar o nome exibido na aba do navegador. -->
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div id="dotted-surface-container" class="dotted-surface-bg"></div>
  <main class="login-page">
    <!-- Marca: aria-label fornece o nome acessível; o naipe é apenas decorativo. -->
    <div class="brand" aria-label="Royal Hold'em">
      <span class="brand-suit" aria-hidden="true">♠</span>
      <span>ROYAL <strong>HOLD'EM</strong></span>
    </div>

    <section class="login-card" aria-labelledby="login-title">
      <!-- Título e descrição da caixa. aria-labelledby aponta para o ID do título. -->
      <span class="eyebrow">SEU LUGAR À MESA</span>
      <h1 id="login-title">Bem-vindo de volta</h1>
      <p class="intro">Entre na sua conta para começar a jogar.</p>

      <form id="login-form">
        <!--
          for conecta o rótulo ao id do campo. name identifica o dado do formulário.
          required impede envio vazio; maxlength limita o usuário a 50 caracteres.
          autocomplete ajuda o preenchimento; placeholder é a dica dentro do campo.
          autocapitalize e spellcheck evitam corrigir automaticamente o usuário.
        -->
        <label for="username">Nome de usuário</label>
        <input id="username" name="username" type="text" placeholder="Digite seu usuário" autocomplete="username"
          autocapitalize="none" spellcheck="false" required maxlength="50">

        <label for="password">Senha</label>
        <div class="password-field">
          <!-- type="password" mascara o texto visualmente; não autentica nem criptografa dados. -->
          <input id="password" name="password" type="password" placeholder="Digite sua senha"
            autocomplete="current-password" required>
          <button class="show-password" id="show-password" type="button" aria-label="Mostrar senha"
            aria-controls="password" aria-pressed="false">Mostrar</button>
          <!-- type="button" evita enviar o formulário; aria-pressed indica se a senha está visível. -->
        </div>

        <!-- submit dispara o evento do formulário, inclusive quando a pessoa pressiona Enter. -->
        <button class="login-button" type="submit">Entrar <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <div class="signup-area">
      <!-- Fica fora da section para posicionar o cadastro abaixo da caixa de login. -->
      <p>Ainda não tem uma conta?</p>
      <button class="signup-button" id="create-account" type="button">Criar conta</button>
    </div>
    <!-- Mensagens são preenchidas pelo JS e anunciadas por leitores de tela sem mover o foco. -->
    <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
    <div class="suits" aria-hidden="true">♠ <span>♥</span> ♣ <span>♦</span></div>
  </main>
  <script type="module" src="./src/login.js"></script>

</body>

</html>
