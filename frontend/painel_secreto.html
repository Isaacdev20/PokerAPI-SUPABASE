<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Royal Hold'em</title>
    <link rel="stylesheet" href="login.css">
    <style>
        .admin-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            z-index: 1;
            position: relative;
        }

        .admin-card {
            background: rgba(20, 10, 10, 0.95);
            border: 1px solid rgba(255, 50, 50, 0.5);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 100, 100, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .admin-list {
            list-style: none;
            padding: 0;
            margin: 1.5rem 0;
            text-align: left;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .admin-name {
            flex: 1;
            font-weight: 500;
        }

        .chip-edit-input {
            width: 120px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ff4444;
            background: #111;
            color: #ffd700;
            text-align: right;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .save-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-size: 1.1rem;
            transition: background 0.3s;
        }

        .save-btn:hover {
            background: #ff6666;
        }

        #access-denied {
            color: red;
            display: none;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="dotted-surface-container" class="dotted-surface-bg"></div>

    <main class="admin-page">
        <div id="access-denied">
            Acesso Negado! Identificando invasor...
        </div>

        <section class="admin-card" id="admin-panel" style="display: none;">
            <span class="eyebrow" style="color: #ff4444;">ÁREA RESTRITA</span>
            <h1 id="login-title">Painel de Mestre</h1>
            <p class="intro">Gerenciamento absoluto das fichas.</p>

            <div id="loading-msg" style="color: white; margin: 2rem 0;">Carregando dados...</div>

            <ul class="admin-list" id="admin-list">
                <!-- Jogadores serão inseridos aqui -->
            </ul>

            <button id="save-chips-btn" class="save-btn">Salvar Alterações de Fichas</button>
            <p id="admin-status" style="margin-top: 15px; font-size: 1rem;"></p>

            <a href="jogo.html"
                style="color: #aaa; text-decoration: underline; margin-top: 20px; display: inline-block;">Voltar para o
                jogo</a>
        </section>
    </main>

    <script type="module" src="./src/dotted-surface.js"></script>
    <script type="module" src="./src/painel_secreto.js"></script>
</body>

</html>
